<section class="panel">

    <h2>❤️ Registrar relación</h2>

    <label>Fecha</label>
    <input type="date" id="relationDate">

    <label>Protección</label>

    <div class="protection-options">

        <button
            type="button"
            class="protection-option"
            id="protectedBtn"
            onclick="selectProtection('protected')"
        >
            🛡️
            <span>Con protección</span>
        </button>

        <button
            type="button"
            class="protection-option"
            id="unprotectedBtn"
            onclick="selectProtection('unprotected')"
        >
            ❤️
            <span>Sin protección</span>
        </button>

    </div>

    <button class="main-btn relation-btn" id="addRelation">
        ❤️ Guardar relación
    </button>

    <div id="relationsList"></div>

</section>
